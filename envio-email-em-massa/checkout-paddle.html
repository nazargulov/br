<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Premium — EmailMassa</title>
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            max-width: 440px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 32px 28px;
            text-align: center;
        }
        .logo {
            width: 56px;
            height: 56px;
            background: #04ae45;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .logo svg { width: 32px; height: 32px; fill: white; }
        h1 { font-size: 1.3rem; color: #002776; margin-bottom: 8px; }
        p { color: #64748b; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; }
        .loading {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 4px solid #e2e8f0;
            border-top-color: #04ae45;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 12px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-top: 16px;
            display: none;
        }
        .success {
            background: #f0fdf4;
            border: 1px solid #86efac;
            color: #166534;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-top: 16px;
            display: none;
        }
        .btn {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 24px;
            background: #04ae45;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .btn:hover { background: #038c37; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        </div>
        <h1>EmailMassa Premium</h1>
        <p id="msg">Preparando o checkout seguro do Paddle…</p>
        <div class="loading" id="spinner"></div>
        <div class="error" id="err"></div>
        <div class="success" id="ok">
            Pagamento recebido! Sua assinatura será ativada em poucos segundos.
            <br><br>
            <a href="sucesso.html" class="btn">Continuar</a>
        </div>
    </div>

    <script>
    const qs = new URLSearchParams(location.search);
    const transactionId = qs.get('_ptxn');
    const spinner = document.getElementById('spinner');
    const msg = document.getElementById('msg');
    const err = document.getElementById('err');
    const ok = document.getElementById('ok');

    function showError(text) {
        spinner.style.display = 'none';
        err.textContent = text;
        err.style.display = 'block';
    }

    if (!transactionId) {
        showError('Link de pagamento inválido. Volte ao EmailMassa e tente novamente.');
    } else {
        Paddle.Environment.set('production');
        Paddle.Initialize({
            token: 'live_e353ebd78e177dfb30647953c3e',
            eventCallback: (event) => {
                if (event.name === 'checkout.completed') {
                    spinner.style.display = 'none';
                    msg.style.display = 'none';
                    ok.style.display = 'block';
                }
                if (event.name === 'checkout.closed' && !ok.style.display.includes('block')) {
                    showError('Checkout fechado. Você pode tentar novamente no EmailMassa.');
                }
                if (event.name === 'checkout.error') {
                    showError('Erro no checkout: ' + (event.data?.error?.detail || 'tente novamente'));
                }
            }
        });
        Paddle.Checkout.open({ transactionId });
    }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9ERQ0RV4GZ"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-9ERQ0RV4GZ');</script>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9782800108858107"
         crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <title>Checkout | EmailMassa</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f8f7 0%, #ffffff 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 520px;
            background: #fff;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(2, 6, 23, 0.12);
        }
        h1 { margin: 0 0 8px; font-size: 1.5rem; }
        p { margin: 0 0 18px; color: #475569; }
        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1rem;
            margin-bottom: 14px;
        }
        .method-grid {
            display: grid;
            gap: 10px;
            margin: 0 0 14px;
        }
        .method-option {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            background: #fff;
            color: #1e293b;
            text-align: left;
            cursor: pointer;
        }
        .method-option.selected {
            border-color: #04ae45;
            background: rgba(4, 174, 69, 0.07);
        }
        .method-name {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-weight: 800;
        }
        .method-hint {
            display: block;
            margin-top: 3px;
            color: #64748b;
            font-size: 0.9rem;
        }
        .badge {
            color: #038c37;
            font-size: 0.78rem;
            font-weight: 800;
        }
        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #04ae45 0%, #038c37 100%);
            cursor: pointer;
        }
        button:disabled { opacity: 0.7; cursor: wait; }
        .status { margin-top: 12px; font-size: 0.92rem; color: #475569; }
        .status.error { color: #dc2626; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Comprar acesso Premium</h1>
        <p>Digite o email da sua conta Gmail. A cobrança é feita uma única vez, sem assinatura ou renovação automática.</p>
        <label for="email">Seu email</label>
        <input id="email" type="email" placeholder="voce@empresa.com.br" autocomplete="email">
        <label>Pagamento seguro</label>
        <div class="method-grid">
            <button class="method-option selected" type="button" data-provider="stripe" data-price-30="R$9,90 uma vez" data-price-365="R$99,00 uma vez">
                <span class="method-name">Stripe <span class="badge">Pagamento único</span></span>
                <span class="method-hint">PIX, cartão e carteiras digitais conforme disponibilidade</span>
            </button>
        </div>
        <button id="payBtn" type="button">Continuar para pagamento</button>
        <div id="status" class="status"></div>
        <p style="margin-top: 16px; font-size: 0.8rem; color: #94a3b8; text-align: center;">
            Ao continuar, você concorda com os <a href="termos.html" style="color: #04ae45;">Termos de Uso</a> e a <a href="privacidade.html" style="color: #04ae45;">Política de Privacidade</a>.
        </p>
    </div>

    <script>
        const BILLING_SERVER = 'https://emailmassa-billing.u9603656505.workers.dev';
        const selectedProvider = 'stripe';

        function setStatus(message, isError = false) {
            const el = document.getElementById('status');
            el.textContent = message;
            el.classList.toggle('error', isError);
        }

        function selectedPlan() {
            return new URLSearchParams(window.location.search).get('plan') === 'premium_365d'
                ? 'premium_365d'
                : 'premium_30d';
        }

        function updatePayButton() {
            const option = document.querySelector(`.method-option[data-provider="${selectedProvider}"]`);
            const price = selectedPlan() === 'premium_365d' ? option.dataset.price365 : option.dataset.price30;
            document.getElementById('payBtn').textContent = `Continuar — ${price}`;
        }

        document.getElementById('payBtn').addEventListener('click', async () => {
            const email = (document.getElementById('email').value || '').trim().toLowerCase();
            if (!email || !email.includes('@')) {
                setStatus('Informe um email válido.', true);
                return;
            }

            const btn = document.getElementById('payBtn');
            btn.disabled = true;
            setStatus('Criando checkout...');
            try {
                const plan = selectedPlan();
                const response = await fetch(`${BILLING_SERVER}/api/checkout-session`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email,
                        plan,
                        provider: selectedProvider,
                        market: 'br',
                        locale: 'pt-BR'
                    })
                });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok || !payload.url) {
                    throw new Error(payload.error || 'Falha ao criar checkout');
                }
                window.location.href = payload.url;
            } catch (error) {
                setStatus(error.message || 'Erro ao abrir checkout.', true);
                btn.disabled = false;
            }
        });

        updatePayButton();
    </script>
</body>
</html>

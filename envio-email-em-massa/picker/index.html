<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="origin">
    <title>Selecionar planilha | EmailMassa</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: #1f1f1f;
        }
        .frame {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            max-width: 420px;
        }
        .spinner {
            margin: 24px 0;
            width: 32px;
            height: 32px;
            border: 3px solid #e0e0e0;
            border-top-color: #04ae45;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hint {
            margin-top: 16px;
            font-size: 12px;
            color: #888;
        }
        .error h1 { color: #c5221f; }
    </style>
</head>
<body>
    <div class="frame" id="state">
        <h1 id="title">Conectando ao Google Drive</h1>
        <p id="status">Carregando seletor de planilhas…</p>
        <div class="spinner" id="spinner"></div>
        <p class="hint" id="hint">Você pode fechar esta janela a qualquer momento.</p>
    </div>
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="picker.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Cancelado | EmailMassa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #fef2f2 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 50px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }
        h1 {
            color: #1e293b;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        p {
            color: #64748b;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
        }
        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #64748b;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        .support {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .support a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">😕</div>
        <h1>Pagamento não concluído</h1>
        <p>Parece que você cancelou o pagamento. Não se preocupe, você pode tentar novamente quando quiser.</p>

        <div class="options">
            <a href="index.html#precos" class="btn btn-primary">
                Tentar Novamente
            </a>
            <a href="index.html" class="btn btn-secondary">
                Voltar para o Site
            </a>
        </div>

        <p class="support">
            Teve algum problema? <a href="https://wa.me/5511999999999" target="_blank">Fale conosco no WhatsApp</a>
        </p>
    </div>
</body>
</html>
